<!DOCTYPE html>
<html lang="pt-br">

        <div class="opcoes">

                <div class="op login">
                    <button class="btn-nav">

                    </button>
                </div>
                <div class="carrinho">
                    <p>🛒</p>
                </div>
            </div>
        </div>
    </div>
    <div class="barra-de-links">
        <div><a class="links" href="../index.html">Home</a></div>

        <div><a class="links" href="sobre.html">Sobre</a></div>
        <div><a class="links" href="Contato.html">Contato</a></div>

                <div>

                    <div class="campo email">
                        <label for="campo-email">E-mail</label>
                        <input class="input email" type="email" id="campo-email" name="campo-email">
                    </div>
                    <div class="campo senha">
                        <label for="campo-senha">Senha</label>
                        <input class="input senha" type="password" id="campo-senha" name="campo-senha">
                    </div>
                    <button>
                        <a href="../index.html">Entrar</a>
                    </button>

                    <a href="cadastro.html">Cadastre-se</a>

                <img class="img-icon" src="../assets/image/icon.png" alt="icon-instagran-facebook-whatsapp">

            <div class="footer-2">
