<!DOCTYPE html>
<html lang="pt-vr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/cadastro.css">
    <link rel="shortcut icon" href="../assets/image/logo1.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Sans+Hegarty&display=swap" rel="stylesheet">
    <title>LVY TCG</title>
</head>
<body>
    <div class="cadastro">
        <form class="formulario" action="login.html">
            <div class="logo"><img class="img-logo" src="../assets/image/logo1.png" alt="logo"></div>
            <h1 class="titulo">Faça seu Cadastro</h1>
            <div class="campo nome">
                <label for="campo-nome">Nome</label>
                <input class="input nome" type="text" id="campo-nome" name="campo-nome">
            </div>
                <div class="campo cpf">
                <label for="campo-cpf">CPF</label>
                <input class="input cpf"type="text" id="campo-cpf" name="campo-cpf">
            </div>
            <div class="campo email">
                <label for="campo-email">E-mail</label>
                <input class="input email" type="email" id="campo-email" name="campo-email">
            </div>
            <div class="campo senha">
                <label for="campo-senha">Senha</label>
                <input class="input senha" type="password" id="campo-senha" name="campo-senha">
            </div>
            <div class="botao"><button class="btn">Cadastrar</button></div>
        </form>

    </div>
    
</body>
</html>
