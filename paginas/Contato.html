     <div class="home navbar">

            <img class="img-logo" src="assets/image/logo1.png" alt="logo">

        <div class="busca">
            <input class="input-busca" type="text" name="busca" placeholder="Faça sua Busca">
            <p class="lupa">🔍</p>

        </div>
        <div class="opcoes">
            <div class="op login">
                <div class="op login">
                    <button class="btn-nav">
                        <a class="btn-nav-a" href="login.html">Login</a>
                    </button>
                </div>
                <div class="carrinho">
                    <p>🛒</p>
                </div>
            </div>
        </div>
    </div>
    <div class="barra-de-links">
        <div><a class="links" href="../index.html">Home</a></div>

        <div><a class="links" href="sobre.html">Sobre</a></div>
        <div><a class="links" id="active" href="Contato.html">Contato</a></div>

  <div class="contato">
        <form class="formulario" action="login.html">
           
            <h1 class="titulo">Nos envie sua experiência</h1>
            <div class="campo nome">
                <label for="campo-nome">Nome</label>
                <input class="input nome" type="text" placeholder="Seu nome" id="campo-nome" name="campo-nome">
            </div>
                <div class="campo cpf">
                <label for="campo-cpf">CPF</label>
                <input class="input cpf"type="text"  placeholder="Ex:000.000.000-00" id="campo-cpf" name="campo-cpf">
            </div>
            <div class="campo email">
                <label for="campo-email">E-mail</label>
                <input class="input email" type="email" id="campo-email" placeholder="...@gmail.com" name="campo-email">
            </div>
            <div class="campo numero">
                <label for="campo-senha">Telefone</label>
                <input class="input number" type="number" placeholder="+55 (47) 99999-9999" id="campo-numero" name="campo-numero">
            </div>  
            <div class="campo dados">
                <label class="tt" for="campo-dados">Mensagem</label>
                <input class="input dados" type="text" placeholder="Digite sua mensagem" id="campo-dados" name="campo-dados">
            </div>
            <div class="botao"><button class="btn">Enviar</button></div>
        </form>

    </div>

















     <div class="footer space-between">
        <div class="footer-1">
            <div class="logo">
                <img class="img-logo-footer" src="assets/image/logo1.png" alt="logo">
            </div>
            <div class="icon">
                <img class="img-icon" src="assets/image/icon.png" alt="icon-instagran-facebook-whatsapp">
            </div>
            <div class="footer-2">
                <div class="horario">
                    <p>Horario de Funcionamento</p>
                    <p>Segunda a Sábado, das 8h00 ás 18h00</p>
                </div>
            </div>
            <div>
                <div class="footer-3">
                    <p>Contato</p>
                    <p>(47) 99999-9999</p>
                </div>
            </div>
        </div>

    </div>
</body>
